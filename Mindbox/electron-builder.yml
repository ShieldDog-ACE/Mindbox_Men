appId: com.mindbox.app
productName: Mindbox
publish: null # 本地打包,不发布到任何渠道
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
# 后端整体(含 .pylibs 依赖)打进安装包,自包含,目标机只需系统 python3
# M4 换 PyInstaller 单文件 sidecar 后可瘦身
extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*"
      - "!**/__pycache__"
linux:
  target:
    - deb
  category: Office
  maintainer: Fuka <fuka@local>
  desktop:
    Name: Mindbox
    Comment: AI 记忆笔记软件
